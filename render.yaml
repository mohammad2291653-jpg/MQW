# Free web runtime; persistent records and audio live in Supabase Free Postgres.
# Review docs/FREE_HOSTING_PLAN.md before any separately authorized deployment.
# This file is packaging, not authorization to create or deploy infrastructure.
# Create a NEW service only; do not adopt unrelated existing services.
services:
  - type: web
    name: mqw
    runtime: docker
    repo: https://github.com/mohammad2291653-jpg/MQW
    # Inherit the branch selected for the Blueprint (free-cloud during review).
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MQW_STORAGE_BACKEND
        value: postgres
      # Restricted mqw_app role via the actual IPv4 Session Pooler, port 5432.
      # Provide through Render's private environment binding; never commit it.
      - key: MQW_DATABASE_URL
        sync: false
      # MQW_DATABASE_CA_CERT can be added privately if a custom CA is required.
      - key: MQW_OWNER_EMAIL
        sync: false
      - key: MQW_SETUP_TOKEN_HASH
        sync: false
      # Startup falls back to Render's HTTPS URL; this explicit self-reference
      # also makes the application origin visible in the reviewed configuration.
      - key: MQW_APP_ORIGIN
        fromService:
          name: mqw
          type: web
          envVarKey: RENDER_EXTERNAL_URL
